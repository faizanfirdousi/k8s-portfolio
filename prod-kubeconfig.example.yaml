# Optional — only if you want kubectl from your laptop (debugging).
# Normal deploys use GitHub Actions or SSH to EC2; kubectl runs on the server.
#
#   ssh -L 6443:127.0.0.1:6443 ubuntu@<ec2-ip>
#   k3d kubeconfig get portfolio > prod-kubeconfig.yaml
#   # set server: https://127.0.0.1:6443
#
# NEVER commit prod-kubeconfig.yaml.

apiVersion: v1
clusters:
- cluster:
    certificate-authority-data: <paste-ca-data-from-k3d-kubeconfig>
    server: https://127.0.0.1:6443
  name: portfolio-prod
contexts:
- context:
    cluster: portfolio-prod
    user: admin@portfolio-prod
  name: portfolio-prod
current-context: portfolio-prod
kind: Config
users:
- name: admin@portfolio-prod
  user:
    client-certificate-data: <paste-client-cert>
    client-key-data: <paste-client-key>
