# Copy to prod-kubeconfig.yaml and fill in after provisioning EC2.
# NEVER commit prod-kubeconfig.yaml — it contains cluster admin credentials.
#
# Remote access (API is NOT exposed publicly on EC2):
#   ssh -L 6443:127.0.0.1:6443 ubuntu@<ec2-public-ip>
#   kubectl get pods -A --kubeconfig prod-kubeconfig.yaml
#
# On the EC2 instance, copy the kubeconfig from k3d:
#   k3d kubeconfig get portfolio > prod-kubeconfig.yaml
# Then change the server URL to https://127.0.0.1:6443 for SSH-tunnel use.

apiVersion: v1
clusters:
- cluster:
    certificate-authority-data: <paste-ca-data-from-k3d-kubeconfig>
    server: https://127.0.0.1:6443
  name: portfolio-prod
contexts:
- context:
    cluster: portfolio-prod
    user: admin@portfolio-prod
  name: portfolio-prod
current-context: portfolio-prod
kind: Config
users:
- name: admin@portfolio-prod
  user:
    client-certificate-data: <paste-client-cert>
    client-key-data: <paste-client-key>
