server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: if file doesn't exist, serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check for Kubernetes probes
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
