# services/frontend/nginx.conf
server {
    listen 8080;
    server_name _;
    server_tokens off;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data: https:;" always;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: if file doesn't exist, serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check for Kubernetes probes
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
