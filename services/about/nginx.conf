# services/about/nginx.conf
#
# Custom Nginx configuration for the about service.
#
# HOW PATH REWRITING WORKS WITH THIS INGRESS SETUP:
# Traefik's StripPrefix middleware removes the /about prefix before forwarding.
# This means: when a browser requests /about/something, Traefik strips
# the /about prefix and forwards just /something (or /) to this container.
#
# So nginx inside this container receives:
#   Browser: GET /about      → nginx gets: GET /
#   Browser: GET /about/foo  → nginx gets: GET /foo
#
# This means we serve at location / (NOT /about).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The root location handles all rewritten requests from the ingress
    # (the /about prefix was already stripped before reaching us)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint — Kubernetes liveness/readiness probes call this
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
