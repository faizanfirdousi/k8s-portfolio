# manifests/network-policies/allow-traefik-ingress.yaml
#
# Allows incoming HTTP traffic from the Traefik Ingress controller (kube-system)
# to backend service pods in each portfolio namespace.

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-ingress
  namespace: about
spec:
  podSelector:
    matchLabels:
      app: about
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 8080

