# manifests/network-policies/default-deny.yaml
#
# Default Deny NetworkPolicy: Denies all ingress and egress traffic
# by default across all portfolio namespaces.
#
# Allowed traffic must be explicitly declared in companion NetworkPolicies.

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: about
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

