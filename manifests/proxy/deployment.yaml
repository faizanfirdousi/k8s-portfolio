# manifests/proxy/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
  namespace: proxy
  labels:
    app: proxy

spec:
  replicas: 1

  selector:
    matchLabels:
      app: proxy

  template:
    metadata:
      labels:
        app: proxy

    spec:
      serviceAccountName: topology-reader

      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: proxy
          image: portfolio/proxy:local
          imagePullPolicy: Never

          ports:
            - containerPort: 8080

          env:
            - name: PORT
              value: "8080"

          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5

          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
              ephemeral-storage: "10Mi"
            limits:
              memory: "64Mi"
              cpu: "100m"
              ephemeral-storage: "20Mi"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
