# manifests/proxy/serviceaccount.yaml
#
# A ServiceAccount is a Kubernetes identity for a Pod.
# When a Pod runs with a ServiceAccount, Kubernetes automatically mounts
# the ServiceAccount's token into the Pod at:
#   /var/run/secrets/kubernetes.io/serviceaccount/token
#
# client-go reads this token to authenticate API requests.
# Without a ServiceAccount, the Pod gets the "default" SA — which has no permissions.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: topology-reader      # This name is referenced in the ClusterRoleBinding below
  namespace: proxy           # The SA lives in the proxy namespace
  labels:
    app.kubernetes.io/part-of: portfolio
