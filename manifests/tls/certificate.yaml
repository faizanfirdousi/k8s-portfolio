# TLS certificate for the portfolio domain.
# Replace PORTFOLIO_DOMAIN before applying (e.g. k8s.example.com).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: portfolio-tls
  namespace: default
spec:
  secretName: portfolio-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - PORTFOLIO_DOMAIN
