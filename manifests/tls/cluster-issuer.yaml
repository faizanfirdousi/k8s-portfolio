# Let's Encrypt ClusterIssuer for portfolio TLS.
# Set CERT_MANAGER_EMAIL in the environment before applying, or edit the email below.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: portfolio@example.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: traefik
