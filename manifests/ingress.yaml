# manifests/ingress.yaml
#
# Traefik routing for the entire portfolio.
# k3s ships Traefik as the built-in ingress controller — we use its IngressRoute CRD
# for path-based routing and StripPrefix middlewares to rewrite URLs before forwarding.
#
# HOW TRAFFIC FLOWS:
#   1. A browser request hits the k3d load balancer on port 80 (mapped from localhost:8080)
#   2. The load balancer forwards to the Traefik controller Pod in kube-system
#   3. Traefik reads this IngressRoute and matches the request path to a backend Service
#   4. StripPrefix middleware removes the section prefix (/about, /blog, etc.) before forwarding
#   5. The Service routes to a healthy Pod
#
# Cross-namespace routing:
#   Services live in different namespaces. Traefik IngressRoute supports a `namespace`
#   field on each backend Service — no ExternalName aliases needed.
#   (Traefik rejects ExternalName services by default.)

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-about
  namespace: default
spec:
  stripPrefix:
    prefixes:
      - /about

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-projects
  namespace: default
spec:
  stripPrefix:
    prefixes:
      - /projects

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-blog
  namespace: default
spec:
  stripPrefix:
    prefixes:
      - /blog

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-contact
  namespace: default
spec:
  stripPrefix:
    prefixes:
      - /contact

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: portfolio
  namespace: default
spec:
  entryPoints:
    - web
  routes:
    # More specific paths first; catch-all last.
    - match: PathPrefix(`/api`)
      kind: Rule
      priority: 20
      services:
        - name: proxy
          namespace: proxy
          port: 80

    - match: PathPrefix(`/about`)
      kind: Rule
      priority: 20
      middlewares:
        - name: strip-about
      services:
        - name: about
          namespace: about
          port: 80

    - match: PathPrefix(`/projects`)
      kind: Rule
      priority: 20
      middlewares:
        - name: strip-projects
      services:
        - name: projects
          namespace: projects
          port: 80

    - match: PathPrefix(`/blog`)
      kind: Rule
      priority: 20
      middlewares:
        - name: strip-blog
      services:
        - name: blog
          namespace: blog
          port: 80

    - match: PathPrefix(`/contact`)
      kind: Rule
      priority: 20
      middlewares:
        - name: strip-contact
      services:
        - name: contact
          namespace: contact
          port: 80

    - match: PathPrefix(`/`)
      kind: Rule
      priority: 1
      services:
        - name: frontend
          namespace: frontend
          port: 80
