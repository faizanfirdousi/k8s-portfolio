# manifests/ingress.yaml
#
# Hardened Traefik routing for the entire portfolio.
# Features:
#   - Path-based routing with stripPrefix middlewares
#   - Security headers (HSTS, X-Frame-Options, X-Content-Type-Options, Referrer-Policy, Permissions-Policy)
#   - Global & Contact-specific rate limiting
#   - Request body buffering & size limits

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: default
spec:
  headers:
    frameDeny: false
    customResponseHeaders:
      X-Frame-Options: "SAMEORIGIN"
      X-Content-Type-Options: "nosniff"
      Referrer-Policy: "strict-origin-when-cross-origin"
      Permissions-Policy: "camera=(), microphone=(), geolocation=()"
    browserXssFilter: true
    contentTypeNosniff: true
    stsSeconds: 63072000
    stsIncludeSubdomains: true
    stsPreload: true

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: global-ratelimit
  namespace: default
spec:
  rateLimit:
    average: 100
    burst: 50

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: request-buffer
  namespace: default
spec:
  buffering:
    maxRequestBodyBytes: 1048576  # 1 MB max request body to prevent memory DoS
    memRequestBodyBytes: 262144   # 256 KB memory buffer

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-about
  namespace: default
spec:
  stripPrefix:
    prefixes:
      - /about

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-projects
  namespace: default
spec:
  stripPrefix:
    prefixes:
      - /projects

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-blog
  namespace: default
spec:
  stripPrefix:
    prefixes:
      - /blog

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-contact
  namespace: default
spec:
  stripPrefix:
    prefixes:
      - /contact

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-skills
  namespace: default
spec:
  stripPrefix:
    prefixes:
      - /skills

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: portfolio
  namespace: default
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/api`)
      kind: Rule
      priority: 20
      middlewares:
        - name: security-headers
        - name: global-ratelimit
        - name: request-buffer
      services:
        - name: proxy
          namespace: proxy
          port: 80

    - match: PathPrefix(`/about`)
      kind: Rule
      priority: 20
      middlewares:
        - name: strip-about
        - name: security-headers
        - name: global-ratelimit
      services:
        - name: about
          namespace: about
          port: 80

    - match: PathPrefix(`/projects`)
      kind: Rule
      priority: 20
      middlewares:
        - name: strip-projects
        - name: security-headers
        - name: global-ratelimit
      services:
        - name: projects
          namespace: projects
          port: 80

    - match: PathPrefix(`/blog`)
      kind: Rule
      priority: 20
      middlewares:
        - name: strip-blog
        - name: security-headers
        - name: global-ratelimit
      services:
        - name: blog
          namespace: blog
          port: 80

    - match: PathPrefix(`/skills`)
      kind: Rule
      priority: 20
      middlewares:
        - name: strip-skills
        - name: security-headers
        - name: global-ratelimit
      services:
        - name: skills
          namespace: skills
          port: 80

    - match: PathPrefix(`/contact`)
      kind: Rule
      priority: 20
      middlewares:
        - name: strip-contact
        - name: security-headers
        - name: global-ratelimit
        - name: request-buffer
      services:
        - name: contact
          namespace: contact
          port: 80

    - match: PathPrefix(`/`)
      kind: Rule
      priority: 1
      middlewares:
        - name: security-headers
        - name: global-ratelimit
      services:
        - name: frontend
          namespace: frontend
          port: 80
