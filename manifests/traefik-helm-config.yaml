# Mounted into k3s at cluster creation (see k3d-config.yaml volumes).
# Allows IngressRoute in `default` to route to Services in other namespaces.
# Also enables Prometheus metrics on port 9100 so Prometheus can scrape request rates.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
    metrics:
      prometheus:
        entryPoint: metrics
    ports:
      metrics:
        port: 9100
        expose:
          default: true
        exposedPort: 9100
        protocol: TCP
