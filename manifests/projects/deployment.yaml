# manifests/projects/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: projects
  namespace: projects
  labels:
    app: projects

spec:
  replicas: 1

  selector:
    matchLabels:
      app: projects

  template:
    metadata:
      labels:
        app: projects
        portfolio-section: projects

    spec:
      containers:
        - name: projects
          image: portfolio/projects:local
          imagePullPolicy: Never

          ports:
            - containerPort: 3000

          # Environment variables: configure the service without changing code.
          # GITHUB_USERNAME tells the app which GitHub account to pull stats from.
          # This is the correct Kubernetes pattern: values in env, secrets in Secrets.
          env:
            - name: PORT
              value: "3000"
            - name: GITHUB_USERNAME
              value: "faizanfirdousi"
            # GITHUB_TOKEN is intentionally omitted here for v1 (local dev).
            # In Phase 5 (production), add it as a reference to a Kubernetes Secret:
            #   - name: GITHUB_TOKEN
            #     valueFrom:
            #       secretKeyRef:
            #         name: github-credentials
            #         key: token

          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10   # Node.js needs a bit longer to start than Nginx
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5

          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
