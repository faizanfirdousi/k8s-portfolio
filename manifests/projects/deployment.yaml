# manifests/projects/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: projects
  namespace: projects
  labels:
    app: projects

spec:
  replicas: 1

  selector:
    matchLabels:
      app: projects

  template:
    metadata:
      labels:
        app: projects
        portfolio-section: projects

    spec:
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: projects
          image: faizanfirdousi/portfolio-projects:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 3000

          env:
            - name: PORT
              value: "3000"
            - name: GITHUB_USERNAME
              value: "faizanfirdousi"
            # Optional production secret reference:
            # - name: GITHUB_TOKEN
            #   valueFrom:
            #     secretKeyRef:
            #       name: github-credentials
            #       key: token

          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5

          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
              ephemeral-storage: "10Mi"
            limits:
              memory: "128Mi"
              cpu: "100m"
              ephemeral-storage: "20Mi"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp

      volumes:
        - name: tmp-volume
          emptyDir:
            medium: Memory
            sizeLimit: 10Mi
