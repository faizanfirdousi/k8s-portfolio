# manifests/about/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: about
  namespace: about
  labels:
    app: about

spec:
  replicas: 1

  selector:
    matchLabels:
      app: about

  template:
    metadata:
      labels:
        app: about
        portfolio-section: about

    spec:
      # Disable ServiceAccount token mounting for security (static site does not need K8s API)
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: about
          image: portfolio/about:local
          imagePullPolicy: Never

          ports:
            - containerPort: 8080

          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5

          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
              ephemeral-storage: "10Mi"
            limits:
              memory: "64Mi"
              cpu: "50m"
              ephemeral-storage: "20Mi"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp

      volumes:
        - name: tmp-volume
          emptyDir:
            medium: Memory
            sizeLimit: 10Mi
