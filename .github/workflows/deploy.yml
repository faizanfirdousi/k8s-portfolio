name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOCKER_USER: faizanfirdousi

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json

      - name: Build and push images
        env:
          NO_CACHE: "1"
        run: ./scripts/publish-images.sh "$DOCKER_USER"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/k8s-portfolio
            git pull
            PORTFOLIO_DOMAIN='${{ vars.PORTFOLIO_DOMAIN }}' ./scripts/apply-ec2-manifests.sh
            for ns_svc in "about about" "projects projects" "skills skills" "blog blog" "contact contact" "proxy proxy" "frontend frontend"; do
              ns="${ns_svc%% *}"
              svc="${ns_svc##* }"
              kubectl rollout restart deployment/$svc -n $ns
              kubectl rollout status deployment/$svc -n $ns --timeout=120s
            done
